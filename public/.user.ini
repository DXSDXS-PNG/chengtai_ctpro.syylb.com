; 承台自身的目录级 PHP 配置（放在 docroot 里，随源码一起发布）
;
; 为什么需要它：承台对外是 {code,msg,data} 的 JSON 契约，而 PHP 的警告会**直接 print 到响应体**。
; 有些服务器（不少面板的默认值）把 display_errors 开着，一旦某处 warning 发生在框架
; 接管错误处理之前（例如入口文件、autoload 阶段），警告就会被当成 HTML 插在 JSON 前面，
; 前端 JSON 解析直接失败，同时把服务器绝对路径等内部信息暴露给公网访客。
; ThinkPHP 自身也会在初始化时关掉 display_errors，这里是入口层的一道兜底。
;
; 生效范围：PHP 的 CGI / FastCGI / FPM 模式会读取 .user.ini，扫描范围是
; 「脚本所在目录 → 逐级向上 → 直到 DOCUMENT_ROOT 为止」。本文件位于 docroot，因此对
; 承台自身与 public/apps/ 下的所有应用一并生效（应用目录里另有一份，见 PluginPackageService）。
; 用 php 内置服务器（php think run / php -S）时不生效，也不会有副作用。
;
; 注意：.user.ini 只能设置 PHP_INI_PERDIR / PHP_INI_ALL 级别的指令，且不是随改随生效
; （PHP 默认缓存 5 分钟，见 user_ini.cache_ttl）。
display_errors = Off
log_errors = On
